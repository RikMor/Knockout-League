<!DOCTYPE html>
<html lang="pt">
<head>
<script type="module" src="manutencao.js"></script>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Knockout League – Entrar</title>
<link rel="stylesheet" href="shared.css?v=3"/>
<style>
  .auth-wrap { max-width: 440px; margin: 0 auto; padding: 64px 5vw 100px; }
  .auth-tabs { display: flex; border: 1px solid var(--ink); margin-bottom: 28px; }
  .auth-tab { flex: 1; text-align: center; padding: 12px 4px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 0.66rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); background: transparent; border: none; border-right: 1px solid var(--ink); }
  .auth-tab:last-child { border-right: none; }
  .auth-tab.active { background: var(--ink); color: var(--bg); }
  .auth-panel { display: none; }
  .auth-panel.active { display: block; }
  #pass-match-error { display: none; color: var(--danger); font-size: 0.78rem; margin-top: 6px; }
  .auth-userbox { display: none; text-align: center; border: 1px solid var(--ink); padding: 40px 28px; }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo"><span class="nav-logo-mark">KL</span><span class="nav-logo-text">KNOCKOUT<span>LEAGUE</span></span></a>
  <button class="nav-mobile-toggle">☰</button>
  <ul class="nav-links">
    <li><a href="index.html" data-i18n="nav.home">Início</a></li>
    <li><a href="torneios.html" data-i18n="nav.tournaments">Torneios</a></li>
    <li><a href="criar-torneio.html" data-i18n="nav.create">Criar torneio</a></li>
    <li><a href="faq.html" data-i18n="nav.faq">FAQ</a></li>
    <li><a href="contacto.html" data-i18n="nav.contact">Contacto</a></li>
    <li id="nav-user-area"><a href="login.html" class="active" data-i18n="nav.login">Entrar</a></li>
  </ul>
</nav>

<div class="auth-wrap">
  <div class="eyebrow" data-i18n="login.eyebrow">Conta</div>
  <h2 style="margin:10px 0 32px;" data-i18n="login.title">Acede à tua conta</h2>

  <div class="auth-userbox" id="userbox">
    <div class="display" style="font-size:1.8rem;"><span data-i18n="login.welcome">Bem-vindo, </span><span id="userbox-name"></span></div>
    <div class="muted" id="userbox-email" style="margin-bottom:24px;"></div>
    <a href="perfil.html" style="display:block;margin-bottom:12px;"><button class="btn btn-accent" style="width:100%;" data-i18n="login.viewProfile">Ver o meu perfil</button></a>
    <button class="btn btn-outline" id="logout-btn" style="width:100%;" data-i18n="login.logout">Terminar sessão</button>
  </div>

  <div id="auth-forms">
    <div class="auth-tabs">
      <button class="auth-tab active" type="button" onclick="switchTab('login')" data-i18n="login.tab.login">Entrar</button>
      <button class="auth-tab" type="button" onclick="switchTab('register')" data-i18n="login.tab.register">Registar</button>
    </div>
    <div class="form-error" id="auth-error"></div>

    <div id="google-block">
      <button type="button" class="btn btn-outline" id="google-btn" style="width:100%;display:flex;gap:10px;margin-bottom:18px;">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.7-3.87 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.94v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.94A9 9 0 0 0 0 9c0 1.45.35 2.83.94 4.03l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .94 4.97l3.01 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        <span data-i18n="login.google">Continuar com Google</span>
      </button>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;color:var(--muted);font-size:0.75rem;">
        <div style="flex:1;height:1px;background:var(--line);"></div><span data-i18n="login.or">ou</span><div style="flex:1;height:1px;background:var(--line);"></div>
      </div>
    </div>

    <div class="auth-panel active" id="panel-login">
      <div class="form-group"><label data-i18n="login.field.email">Email</label><input type="email" id="login-email" autocomplete="email"/></div>
      <div class="form-group"><label data-i18n="login.field.password">Palavra-passe</label><input type="password" id="login-password" autocomplete="current-password"/></div>
      <button type="button" class="btn btn-accent" id="login-submit" style="width:100%;" data-i18n="login.submit">Entrar</button>
    </div>

    <div class="auth-panel" id="panel-register">
      <div class="form-group"><label data-i18n="login.field.nickname">Nickname</label><input type="text" id="reg-nickname" placeholder="Ex: ShadowBlade99" maxlength="24"/></div>
      <div class="form-group"><label data-i18n="login.field.email">Email</label><input type="email" id="reg-email" autocomplete="email"/></div>
      <div class="form-group"><label data-i18n="login.field.password">Palavra-passe</label><input type="password" id="reg-password" autocomplete="new-password"/></div>
      <div class="form-group">
        <label data-i18n="login.field.confirmPassword">Confirmar palavra-passe</label>
        <input type="password" id="reg-password2" autocomplete="new-password"/>
        <div id="pass-match-error" data-i18n="login.err.passMismatch">As palavras-passe não coincidem.</div>
      </div>
      <div class="form-group"><label data-i18n="login.field.continent">Continente</label>
        <select id="reg-continent">
          <option value="" data-i18n="login.field.continentPh">Seleciona o continente</option>
        </select>
      </div>
      <div class="form-group"><label data-i18n="login.field.country">País</label>
        <select id="reg-country" disabled>
          <option value="" data-i18n="login.field.countryPh">Seleciona primeiro o continente</option>
        </select>
      </div>
      <div class="form-group" style="display:flex;align-items:flex-start;gap:10px;">
        <input type="checkbox" id="reg-age" style="width:auto;margin-top:4px;"/>
        <label for="reg-age" style="margin:0;text-transform:none;font-family:'Inter';font-size:0.9rem;color:var(--ink);" data-i18n="login.field.age">Confirmo que tenho pelo menos 13 anos.</label>
      </div>
      <div class="form-group" style="display:flex;align-items:flex-start;gap:10px;">
        <input type="checkbox" id="reg-privacy" style="width:auto;margin-top:4px;"/>
        <label for="reg-privacy" style="margin:0;text-transform:none;font-family:'Inter';font-size:0.9rem;color:var(--ink);"><span data-i18n="login.field.privacy.pre">Li e aceito a </span><a href="politica-privacidade.html" target="_blank" style="color:var(--accent);" data-i18n="login.field.privacy.link">Política de Privacidade</a>.</label>
      </div>
      <button type="button" class="btn btn-accent" id="register-submit" disabled style="width:100%;opacity:.5;">A carregar...</button>
    </div>

  </div>
</div>

<footer>
  <span>© 2026 Knockout League</span>
  <a href="admin.html" style="color:var(--muted);font-size:0.75rem;text-decoration:none;">KNOCKOUTLEAGUE</a>
</footer>

<script src="shared.js"></script>
<script src="i18n.js"></script>
<script>
function switchTab(tab) {
  ['login','register'].forEach(function(t) {
    var btn = document.querySelector('[onclick="switchTab(\''+t+'\')"]');
    var panel = document.getElementById('panel-'+t);
    if (btn) btn.classList.toggle('active', t===tab);
    if (panel) panel.classList.toggle('active', t===tab);
  });
  document.getElementById('google-block').style.display = (tab === 'login') ? 'block' : 'none';
  document.getElementById('auth-error').style.display = 'none';
  document.getElementById('pass-match-error').style.display = 'none';
}

function showError(msg){ var el=document.getElementById('auth-error'); el.textContent=msg; el.style.display='block'; }

var CONTINENTES_PAISES = {"Europa":["Portugal","Espanha","França","Reino Unido","Alemanha","Itália","Países Baixos","Bélgica","Suíça","Áustria","Irlanda","Suécia","Noruega","Dinamarca","Finlândia","Islândia","Polónia","República Checa","Eslováquia","Hungria","Roménia","Bulgária","Grécia","Croácia","Eslovénia","Sérvia","Bósnia e Herzegovina","Montenegro","Macedónia do Norte","Albânia","Kosovo","Ucrânia","Bielorrússia","Moldávia","Rússia","Turquia","Chipre","Malta","Luxemburgo","Estónia","Letónia","Lituânia","Andorra","Mónaco","Liechtenstein","São Marinho","Vaticano"],"América do Norte":["Estados Unidos","Canadá","México","Guatemala","Belize","Honduras","El Salvador","Nicarágua","Costa Rica","Panamá","Cuba","Jamaica","Haiti","República Dominicana","Bahamas","Trindade e Tobago","Barbados"],"América do Sul":["Brasil","Argentina","Chile","Uruguai","Paraguai","Bolívia","Peru","Equador","Colômbia","Venezuela","Guiana","Suriname"],"África":["Angola","Moçambique","Cabo Verde","Guiné-Bissau","São Tomé e Príncipe","Marrocos","Argélia","Tunísia","Líbia","Egito","Nigéria","Gana","Quénia","Etiópia","África do Sul","Senegal","Costa do Marfim","Camarões","Uganda","Tanzânia","Zâmbia","Zimbabué","Namíbia","Botsuana","Ruanda"],"Ásia":["China","Japão","Coreia do Sul","Coreia do Norte","Índia","Paquistão","Bangladesh","Sri Lanka","Nepal","Indonésia","Filipinas","Vietname","Tailândia","Malásia","Singapura","Camboja","Laos","Mianmar","Arábia Saudita","Emirados Árabes Unidos","Catar","Kuwait","Iraque","Irão","Israel","Jordânia","Líbano","Síria","Iémen","Omã","Cazaquistão","Uzbequistão","Timor-Leste","Taiwan","Hong Kong"],"Oceania":["Austrália","Nova Zelândia","Fiji","Papua-Nova Guiné","Samoa","Tonga"]};

(function(){
  var contSel = document.getElementById('reg-continent');
  var countrySel = document.getElementById('reg-country');
  Object.keys(CONTINENTES_PAISES).forEach(function(c){
    var opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    contSel.appendChild(opt);
  });
  contSel.addEventListener('change', function(){
    var cont = contSel.value;
    countrySel.innerHTML = '';
    if(!cont){
      countrySel.disabled = true;
      var placeholder = document.createElement('option');
      placeholder.value=''; placeholder.textContent=(window.KL_T && window.KL_T('login.field.countryPh')) || 'Seleciona primeiro o continente';
      countrySel.appendChild(placeholder);
      return;
    }
    countrySel.disabled = false;
    var ph = document.createElement('option');
    ph.value=''; ph.textContent=(window.KL_T && window.KL_T('login.field.countryPh2')) || 'Seleciona o país';
    countrySel.appendChild(ph);
    CONTINENTES_PAISES[cont].forEach(function(pais){
      var opt = document.createElement('option');
      opt.value = pais; opt.textContent = pais;
      countrySel.appendChild(opt);
    });
  });
})();

document.getElementById('login-submit').addEventListener('click', function(){
  var email=document.getElementById('login-email').value.trim();
  var pass=document.getElementById('login-password').value;
  document.getElementById('auth-error').style.display='none';
  if(!email){showError('Introduz o teu email.');return;}
  if(!pass){showError('Introduz a palavra-passe.');return;}
  if(!window._fbLogin){showError('A carregar Firebase... aguarda um segundo.');return;}
  window._fbLogin(email,pass);
});

document.getElementById('register-submit').addEventListener('click', function(){
  var nick=document.getElementById('reg-nickname').value.trim();
  var email=document.getElementById('reg-email').value.trim();
  var pass=document.getElementById('reg-password').value;
  var pass2=document.getElementById('reg-password2').value;
  var continent=document.getElementById('reg-continent').value;
  var country=document.getElementById('reg-country').value;
  var nationality=country;
  var ageOk=document.getElementById('reg-age').checked;
  var privacyOk=document.getElementById('reg-privacy').checked;
  document.getElementById('auth-error').style.display='none';
  document.getElementById('pass-match-error').style.display='none';
  document.getElementById('reg-password2').style.borderColor='';
  if(!nick){showError('Escolhe um nickname.');return;}
  if(!/^[a-zA-Z0-9_.]{3,24}$/.test(nick)){showError('Nickname: 3–24 caracteres, letras, números, _ ou .');return;}
  if(!email){showError('Introduz o teu email.');return;}
  if(!pass){showError('Introduz uma palavra-passe.');return;}
  if(pass.length<6){showError('A palavra-passe deve ter pelo menos 6 caracteres.');return;}
  if(pass!==pass2){
    document.getElementById('pass-match-error').style.display='block';
    document.getElementById('reg-password2').style.borderColor='var(--danger)';
    return;
  }
  if(!continent){showError('Seleciona o teu continente.');return;}
  if(!country){showError('Seleciona o teu país.');return;}
  if(!ageOk){showError('Confirma que tens pelo menos 13 anos.');return;}
  if(!privacyOk){showError('Tens de aceitar a Política de Privacidade.');return;}
  if(!window._fbRegister){showError('A carregar Firebase... aguarda um segundo.');return;}
  window._fbRegister({nickname:nick,email:email,password:pass,nationality:nationality,continent:continent});
});

document.getElementById('logout-btn').addEventListener('click', function(){
  if(window._fbLogout) window._fbLogout();
});
</script>

<script type="module">
import { auth, db, doc, setDoc } from './firebase.js';
import { collection, getDocs, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut,
         onAuthStateChanged, updateProfile,
         browserSessionPersistence, browserLocalPersistence, setPersistence,
         GoogleAuthProvider, signInWithPopup }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

function showError(msg){var el=document.getElementById('auth-error');el.textContent=msg;el.style.display='block';}
function setBtn(id,dis,txt){var b=document.getElementById(id);if(b){b.disabled=dis;b.style.opacity=dis?'0.5':'1';b.textContent=txt;}}
function translateError(code){
  var map={'auth/email-already-in-use':'Este email já está registado.','auth/invalid-email':'Email inválido.','auth/weak-password':'Palavra-passe com pelo menos 6 caracteres.','auth/user-not-found':'Não existe conta com este email.','auth/wrong-password':'Palavra-passe incorreta.','auth/invalid-credential':'Email ou palavra-passe incorretos.','auth/too-many-requests':'Demasiadas tentativas. Tenta mais tarde.','auth/operation-not-allowed':'Ativa Email/Password na Firebase Console → Authentication.','auth/account-exists-with-different-credential':'Já existe uma conta com este email, criada de outra forma.','auth/popup-blocked':'O browser bloqueou a janela do Google. Permite pop-ups e tenta de novo.'};
  return map[code]||'Erro: '+code;
}

async function isNicknameTaken(nick){
  try{var snap=await getDocs(collection(db,'users'));var l=nick.toLowerCase();return snap.docs.some(function(d){return(d.data().nickname||'').toLowerCase()===l;});}catch(e){return false;}
}
function genTag(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let t='';
  for(let i=0;i<4;i++) t += chars[Math.floor(Math.random()*chars.length)];
  return t;
}

window._fbLogin=function(email,pass){
  setBtn('login-submit',true,'A entrar...');
  setPersistence(auth,browserLocalPersistence)
    .then(function(){return signInWithEmailAndPassword(auth,email,pass);})
    .then(function(){window.location.href='perfil.html';})
    .catch(function(err){showError(translateError(err.code));})
    .finally(function(){setBtn('login-submit',false,'Entrar');});
};

window._fbRegister=async function(d){
  setBtn('register-submit',true,'A verificar...');
  try{
    var taken=await isNicknameTaken(d.nickname);
    if(taken){showError('Nickname já em uso. Escolhe outro.');setBtn('register-submit',false,'Criar conta');return;}
    setBtn('register-submit',true,'A criar conta...');
    var cred=await createUserWithEmailAndPassword(auth,d.email,d.password);
    await updateProfile(cred.user,{displayName:d.nickname});
    await setDoc(doc(db,'users',cred.user.uid),{nickname:d.nickname,nicknameLower:d.nickname.toLowerCase(),tag:genTag(),email:d.email,nationality:d.nationality,continent:d.continent,avatarUrl:'',role:'player',stats:{torneios:0,vitorias:0,derrotas:0,mvp:0},ageConfirmed:true,privacyAccepted:true,createdAt:new Date().toISOString()});
    window.location.href='perfil.html';
  }catch(err){showError(translateError(err.code)||('Erro: '+err.message));setBtn('register-submit',false,'Criar conta');}
};

window._fbLogout=function(){signOut(auth);};

document.getElementById('google-btn').addEventListener('click', async function(){
  document.getElementById('auth-error').style.display='none';
  const btn = document.getElementById('google-btn');
  btn.disabled = true;
  try{
    await setPersistence(auth, browserLocalPersistence);
    const provider = new GoogleAuthProvider();
    const cred = await signInWithPopup(auth, provider);
    const uid = cred.user.uid;
    const existing = await getDoc(doc(db,'users',uid));
    if(!existing.exists()){
      let nick = cred.user.displayName || ('Jogador'+uid.slice(0,4));
      if(await isNicknameTaken(nick)) nick = nick + Math.floor(Math.random()*1000);
      await setDoc(doc(db,'users',uid),{
        name: cred.user.displayName || '', nickname: nick, nicknameLower: nick.toLowerCase(), tag: genTag(),
        email: cred.user.email || '', avatarUrl: cred.user.photoURL || '',
        provider: 'google', role: 'player',
        stats:{torneios:0,vitorias:0,derrotas:0,mvp:0}, createdAt: new Date().toISOString()
      });
    }
    window.location.href = 'perfil.html';
  }catch(err){
    if(err.code !== 'auth/popup-closed-by-user') showError(translateError(err.code) || ('Erro: '+err.message));
  }finally{ btn.disabled = false; }
});

onAuthStateChanged(auth,function(user){
  if(user){
    document.getElementById('auth-forms').style.display='none';
    document.getElementById('userbox').style.display='block';
    document.getElementById('userbox-name').textContent=user.displayName||'Jogador';
    document.getElementById('userbox-email').textContent=user.email;
  }else{
    document.getElementById('auth-forms').style.display='block';
    document.getElementById('userbox').style.display='none';
  }
});

setBtn('register-submit',false,(window.KL_T && window.KL_T('login.register.submit')) || 'Criar conta');
</script>
<script type="module" src="nav-auth.js"></script>
</body>
</html>

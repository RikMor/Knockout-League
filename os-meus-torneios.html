<!DOCTYPE html>
<html lang="pt">
<head>
<script type="module" src="manutencao.js"></script>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Os meus torneios — Knockout League</title>
<link rel="stylesheet" href="shared.css?v=3"/>
<style>
  .tabs { display: flex; border-bottom: 2px solid var(--ink); margin-bottom: 28px; }
  .tab-btn { padding: 12px 20px; background: none; border: none; cursor: pointer; font-weight: 700; font-size: 0.85rem; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .t-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .not-logged { text-align: center; padding: 100px 20px; }
  @media(max-width:760px){ .t-list{grid-template-columns:1fr;} }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo"><span class="nav-logo-mark">KL</span><span class="nav-logo-text">KNOCKOUT<span>LEAGUE</span></span></a>
  <button class="nav-mobile-toggle">☰</button>
  <ul class="nav-links">
    <li><a href="index.html" data-i18n="nav.home">Início</a></li>
    <li><a href="torneios.html" data-i18n="nav.tournaments">Torneios</a></li>
    <li><a href="criar-torneio.html" data-i18n="nav.create">Criar torneio</a></li>
    <li><a href="faq.html" data-i18n="nav.faq">FAQ</a></li>
    <li><a href="contacto.html" data-i18n="nav.contact">Contacto</a></li>
    <li id="nav-user-area"><a href="login.html" data-i18n="nav.login">Entrar</a></li>
  </ul>
</nav>

<div class="wrap page-head">
  <div class="eyebrow" data-i18n="notifpg.eyebrow">A tua conta</div>
  <h1 data-i18n="nav.myTournaments">Os meus torneios</h1>
</div>

<div class="wrap" style="padding-bottom:90px;">
  <div class="not-logged" id="not-logged" style="display:none;">
    <p class="muted" style="margin-bottom:24px;" data-i18n="meus.restricted.text">Tens de iniciar sessão para ver os teus torneios.</p>
    <a href="login.html"><button class="btn btn-accent" data-i18n="nav.login">Entrar</button></a>
  </div>

  <div id="content" style="display:none;">
    <div class="tabs">
      <button class="tab-btn active" data-tab="jogar" data-i18n="meus.tab.playing">A jogar</button>
      <button class="tab-btn" data-tab="organizar" data-i18n="meus.tab.organizing">A organizar / moderar</button>
    </div>

    <div class="tab-panel active" id="panel-jogar">
      <div class="t-list" id="list-jogar"><p class="muted" data-i18n="notifpg.loading">A carregar...</p></div>
    </div>
    <div class="tab-panel" id="panel-organizar">
      <div class="t-list" id="list-organizar"><p class="muted" data-i18n="notifpg.loading">A carregar...</p></div>
    </div>
  </div>
</div>

<footer><span>© 2026 Knockout League</span></footer>

<script src="shared.js"></script>
<script src="i18n.js"></script>
<script>
document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  });
});
</script>

<script type="module">
import { auth, db, collection, getDocs, query, where } from './firebase.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

function tr(k, fallback){ return (window.KL_T && window.KL_T(k)) || fallback; }
function cardHtml(t, id){
  const badgeClass = t.visibility==='private' ? 'badge-private' : 'badge-open';
  const badgeText = t.visibility==='private' ? tr('t.private','Privado') : tr('t.public','Público');
  return `<a href="torneio.html?id=${id}" class="t-card">
    <span class="badge ${badgeClass}">${badgeText}</span>
    <h3>${t.name}</h3>
    <span class="muted">${t.game||''} · ${t.teamSize}v${t.teamSize} · ${t.status||''}</span>
    ${t.organizerDisplayName ? '<span class="muted" style="display:block;font-size:0.78rem;margin-top:4px;">'+tr('index.organizedBy','Organizado por ')+t.organizerDisplayName+'</span>' : ''}
  </a>`;
}

onAuthStateChanged(auth, async function(user){
  if(!user){ document.getElementById('not-logged').style.display = 'block'; return; }
  document.getElementById('content').style.display = 'block';

  // A jogar: torneios onde o uid está na lista de participantes do próprio torneio
  try{
    const snap = await getDocs(query(collection(db,'tournaments'), where('participantUids','array-contains', user.uid)));
    const el = document.getElementById('list-jogar');
    if(snap.empty){ el.innerHTML = '<p class="muted">' + tr('meus.emptyPlaying','Ainda não entraste em nenhum torneio. ') + '<a href="torneios.html" style="color:var(--accent);">' + tr('meus.emptyPlayingLink','Explora os torneios abertos.') + '</a></p>'; }
    else{ el.innerHTML = snap.docs.map(d => cardHtml(d.data(), d.id)).join(''); }
  }catch(e){
    document.getElementById('list-jogar').innerHTML = '<p class="muted">' + tr('meus.errLoad','Erro ao carregar. (') + e.message + ')</p>';
  }

  // A organizar/moderar: sou criador, moderador direto, ou líder/moderador do clube organizador
  try{
    const [creatorSnap, modSnap, clubOwnerSnap, clubModSnap] = await Promise.all([
      getDocs(query(collection(db,'tournaments'), where('creatorUid','==', user.uid))),
      getDocs(query(collection(db,'tournaments'), where('moderatorUids','array-contains', user.uid))),
      getDocs(query(collection(db,'clubs'), where('ownerUid','==', user.uid))),
      getDocs(query(collection(db,'clubs'), where('moderatorUids','array-contains', user.uid)))
    ]);
    const map = new Map();
    creatorSnap.docs.forEach(d=> map.set(d.id, d.data()));
    modSnap.docs.forEach(d=> map.set(d.id, d.data()));
    const myClubIds = [...new Set([...clubOwnerSnap.docs, ...clubModSnap.docs].map(d => d.id))];
    if(myClubIds.length > 0){
      const byClub = await Promise.all(myClubIds.map(cid =>
        getDocs(query(collection(db,'tournaments'), where('organizerClubId','==', cid)))
      ));
      byClub.forEach(snap => snap.docs.forEach(d => map.set(d.id, d.data())));
    }
    const el = document.getElementById('list-organizar');
    if(map.size === 0){ el.innerHTML = '<p class="muted">' + tr('meus.emptyOrganizing','Ainda não organizas nem moderas nenhum torneio. ') + '<a href="criar-torneio.html" style="color:var(--accent);">' + tr('meus.emptyOrganizingLink','Cria um.') + '</a></p>'; }
    else{ el.innerHTML = [...map.entries()].map(([id,t]) => cardHtml(t, id)).join(''); }
  }catch(e){ document.getElementById('list-organizar').innerHTML = '<p class="muted">' + tr('meus.errLoad','Erro ao carregar. (') + e.message + ')</p>'; }
});
</script>
<script type="module" src="nav-auth.js"></script>
</body>
</html>
